[package]
name = "co_audit_ai"
version = "3.0.0"
edition = "2021"
authors = ["ARK Development Team"]
description = "Co-Audit AI for formal verification and Biblical moral auditing"
license = "Biblical-Commons"
repository = "air-gapped"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# Workspace-local integrations.
ethics-dsl = { path = "../ethics_dsl", default-features = false }
cold-mirror = { path = "../cold_mirror", default-features = false }

[dev-dependencies]
proptest = "1.4"

[features]
default = []
minimal = []

[[bin]]
name = "co_audit_ai"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.test]
opt-level = 2
