[package]
name = "network_sentinel"
version = "1.0.0"
edition = "2021"
authors = ["Gabriel <origin@ark-project.org>"]
description = "ARK Network Sentinel - Post-Quantum Secure Communications"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
proptest = "1.4"

[[bin]]
name = "network_sentinel"
path = "src/main.rs"

[lib]
name = "network_sentinel"
path = "src/lib.rs"

[features]
default = []
post-quantum = []
benchmarks = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
