[package]
name = "cold-mirror"
version = "1.0.0"
edition = "2021"
authors = ["Gabriel <origin@ark-project.org>"]
description = "ARK Cold-Mirror - Neural Network Harm Prediction System"
license = "Divine-Moral-Law"
repository = "https://github.com/ark-project/ark"

[lib]
name = "cold_mirror"
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
debug = false
lto = "fat"
codegen-units = 1

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# Ethics integration (workspace-local).
ethics-dsl = { path = "../ethics_dsl", default-features = false }

[dev-dependencies]
proptest = "1.4"

[features]
default = ["cpu-inference"]

cpu-inference = []
gpu-cuda = []
gpu-metal = []
gpu-opencl = []
side-channel-protection = []
timing-attack-protection = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
