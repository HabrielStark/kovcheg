[package]
name = "ethics-dsl"
version = "1.0.0"
edition = "2021"
authors = ["Gabriel <origin@ark-project.org>"]
description = "ARK Ethics Domain-Specific Language - Biblical Morality Engine"
license = "Divine-Moral-Law"
repository = "https://github.com/ark-project/ark"

[lib]
name = "ethics_dsl"
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
debug = false
overflow-checks = true
lto = "fat"
codegen-units = 1

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
proptest = "1.4"

[features]
default = ["biblical-foundation"]

# Core features — the Python reference shim is authoritative until the full
# native engine is migrated.
biblical-foundation = []
grammar-validation = []
semantic-analysis = []
parallel-evaluation = []
async-processing = []
constant-time-ops = []
side-channel-protection = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
